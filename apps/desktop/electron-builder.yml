# Packaging for Wirebench. Run through `pnpm package` (or `package:mac` / `:win` / `:linux`),
# which builds every workspace package first — electron-builder only copies what is already in
# `out/` and in the production `node_modules`, it never compiles anything itself.
#
# Two things here are load-bearing and easy to break:
#   * `asarUnpack` — `xmllint-wasm` reads `xmllint.wasm` off the disk relative to `__dirname`
#     and spawns a worker from it, so it has to live as real files next to the asar.
#   * `afterPack` — flips the Electron fuses (see `scripts/fuses.ts`). It runs before signing,
#     which is required: flipping a fuse rewrites the binary and invalidates any signature.
appId: io.wirebench.desktop
productName: Wirebench
copyright: Copyright © 2026 Wirebench contributors

directories:
  # Icons and entitlements live beside the app, not in a top-level `build/` directory.
  buildResources: resources
  output: release

# `electron-vite` has already bundled main and preload; everything else the app needs at
# runtime is a plain dependency, and electron-builder resolves the pnpm symlinks (including
# the `@wirebench/engine` workspace link) while collecting them.
files:
  - out/**
  - package.json
  - '!**/*.map'
  - '!**/{.eslintrc,.editorconfig,.prettierrc,tsconfig*.json,*.md}'
  - '!**/node_modules/**/{test,__tests__,docs,example,examples}/**'
  # The engine is a workspace package: its checkout carries sources, tests and a coverage
  # report that the built `dist/` does not need and that nothing at runtime resolves.
  - '!**/node_modules/@wirebench/engine/{src,test,coverage,node_modules}/**'

# Flips the Electron fuses on the packed binary (see `scripts/fuses.ts`), before signing. The
# entry lives inside this package because electron-builder refuses hook paths that resolve
# outside what it takes to be the workspace root — which, on Windows runners, is this directory.
afterPack: after-pack.ts

# The generated third-party attribution file, alongside the app's own LICENSE obligations.
# Regenerated and verified by `pnpm licenses:third-party [--check]`.
extraResources:
  - from: ../../THIRD-PARTY-LICENSES.md
    to: THIRD-PARTY-LICENSES.md

asar: true
asarUnpack:
  - '**/node_modules/xmllint-wasm/**'

# pnpm's store is already exactly what should ship, and Wirebench has no native modules to
# rebuild — running npm against a symlinked tree only risks flattening it.
npmRebuild: false

# Update metadata (`latest*.yml`) is generated for GitHub Releases; nothing is ever published
# from a developer machine — `--publish never` is baked into the package scripts.
publish:
  provider: github
  owner: wirebench
  repo: wirebench
  releaseType: draft

mac:
  category: public.app-category.developer-tools
  # Covers the zip; the dmg overrides it below with the same shape.
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  # Universal covers both Macs in one ~230 MB download; the per-arch builds are roughly half
  # that for users who know which Mac they have. The universal build has to produce the x64 and
  # arm64 apps anyway in order to merge them, so shipping all three costs little extra time.
  target:
    - target: dmg
      arch: [universal, x64, arm64]
    - target: zip
      arch: [universal, x64, arm64]
  icon: resources/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  # Wirebench talks to whatever endpoint the user points it at and reads WSDLs off the disk;
  # it asks for nothing else.
  extendInfo:
    NSHumanReadableCopyright: Copyright © 2026 Wirebench contributors

dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

win:
  target:
    - target: nsis
      arch: [x64, arm64]
  icon: resources/icon.png

nsis:
  artifactName: ${productName}-${version}-windows-${arch}-setup.${ext}
  # Per-user by default: no elevation prompt, and an installer that cannot touch the machine.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

appImage:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}

linux:
  # Without this the executable is named after the package (`@wirebench/desktop` minus the
  # slash), which is what ends up in the .desktop file and the install tree.
  executableName: wirebench
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64]
    # x64 only: a snap is built by unpacking a base snap and repacking it, which does not
    # cross-build the way the AppImage and .deb targets do.
    - target: snap
      arch: [x64]
  icon: resources/icon.png
  category: Development
  synopsis: SOAP/WSDL workbench
  description: >-
    Wirebench is a desktop workbench for SOAP and WSDL: import a definition, generate and edit
    envelopes, send them, and inspect what came back.
  maintainer: Wirebench contributors <noreply@wirebench.io>
  desktop:
    entry:
      StartupWMClass: Wirebench

# Both package formats take their name and file name from the npm package name by default —
# `@wirebench/desktop`, whose slash becomes a directory the packager never creates.
deb:
  packageName: wirebench
  artifactName: wirebench_${version}_${arch}.${ext}
rpm:
  packageName: wirebench
  artifactName: wirebench-${version}.${arch}.${ext}

# Confinement is `strict`: the app can reach the network and the user's home directory, and
# nothing else. A WSDL kept outside `$HOME` is not readable from a snap install — that is the
# format's trade-off, not a packaging mistake.
snap:
  artifactName: wirebench_${version}_${arch}.${ext}
  confinement: strict
  plugs:
    - default
    - network
    - home
