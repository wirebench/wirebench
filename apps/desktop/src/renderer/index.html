<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The production Content-Security-Policy meta tag is injected at build time by the
         wirebench-csp-meta plugin in electron.vite.config.ts (see src/main/security.ts for the
         policy string). It is intentionally absent from the dev server's HTML: Vite's inline
         React Fast Refresh preamble and eval-based HMR need what the production policy forbids;
         `windows.ts` skips the header-based policy in dev for the same reason. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wirebench</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
