openapi: 3.0.3
info:
  title: Cycle
  version: 1.0.0
servers:
  - url: https://cycle.test
paths:
  /nodes:
    post:
      operationId: createNode
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Node'
      responses: { '200': { description: ok } }
components:
  schemas:
    Node:
      type: object
      required: [name, child]
      properties:
        name: { type: string }
        child:
          $ref: '#/components/schemas/Node'
        peers:
          type: array
          items:
            $ref: '#/components/schemas/Node'
