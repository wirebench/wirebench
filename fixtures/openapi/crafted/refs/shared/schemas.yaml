openapi: 3.0.3
info:
  title: Shared schemas
  version: 1.0.0
paths: {}
components:
  schemas:
    Pet:
      type: object
      required: [name, status]
      properties:
        name: { type: string, example: Fido }
        status:
          $ref: '#/components/schemas/Status'
    Status:
      type: string
      enum: [available, sold]
