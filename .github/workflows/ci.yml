name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Wall-clock is set by the slowest job, so the test suites are split across runners: Vitest's `--shard` for
# the unit and integration suite, Playwright's for e2e. The shard counts follow each OS's time for the whole
# suite (macOS 22 min, Windows 31, coverage 27; e2e Linux 12, macOS 26, Windows 20), aiming at about ten minutes
# a shard. The organisation's plan runs at most 20 jobs at once, five of them on macOS, so more shards stop
# paying once the runners queue. macOS is the tight one, which is why its Vitest run waits for `main` (`test`).
#
# No job waits for another's result: each fails on its own. Most start as soon as `changes` has run; the
# short ones (a few minutes each) start once `check` has finished, red or green, so that the long shards get
# the first of the 20 runners and the short jobs fill the slots that `check` and the first shards give back.
# Started all at once, the runners went to whichever jobs GitHub picked first, and a long shard that waited
# for one finished last. `coverage-report` waits for `coverage`, whose blobs it merges.

jobs:
  # Which jobs this change calls for (`scripts/ci/changed-jobs.ts`). On a pull request, each job below runs only
  # when a file it builds or reads changed: its packages, the workspace packages they depend on, and the
  # scripts it runs. A documentation-only change (`docs/`, the documentation and landing sites, Markdown and MDX
  # anywhere) calls for none of them; the workflows, the root's files, the lockfile and any folder the script
  # cannot place call for all of them. Pushes to `main` run everything.
  #
  # `code` (anything but documentation) runs the Vitest, coverage and `check` jobs, which cover every package.
  # A skipped job shows as skipped, under its usual name, and `main` requires no check, so it never blocks a
  # merge. What a documentation change can break is still checked: `check` runs on every change, with the two
  # Vitest projects that read docs and the site (`scripts`, `site`); `docs.yml` checks the Markdown and
  # `site.yml` builds the sites.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      server_integration: ${{ steps.filter.outputs.server_integration }}
      tenancy_postgres: ${{ steps.filter.outputs.tenancy_postgres }}
      hosted_e2e: ${{ steps.filter.outputs.hosted_e2e }}
      server_upgrade: ${{ steps.filter.outputs.server_upgrade }}
      browser_e2e: ${{ steps.filter.outputs.browser_e2e }}
      image_smoke: ${{ steps.filter.outputs.image_smoke }}
      npm_smoke: ${{ steps.filter.outputs.npm_smoke }}
      action_smoke: ${{ steps.filter.outputs.action_smoke }}
      kerberos_integration: ${{ steps.filter.outputs.kerberos_integration }}
      wss_xmlsec: ${{ steps.filter.outputs.wss_xmlsec }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      # A pull request checks out its merge commit, whose first parent is the base branch: depth 2 is enough
      # to diff the whole pull request against it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # The script runs on Node's own TypeScript support and needs no install.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo 'A push to main: running everything.'
            node scripts/ci/changed-jobs.ts --all | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          # Kept apart from the script so a failing diff fails the job instead of reading as "nothing changed".
          files=$(git diff --name-only HEAD^1 HEAD)
          echo "$files" | head -n 20
          node scripts/ci/changed-jobs.ts <<< "$files" | tee -a "$GITHUB_OUTPUT"

  # Typecheck, lint, formatting, the generated docs, contrast, doc paths, banned terms, licences and the
  # other source-tree checks (`pnpm check:static`), then the perf budgets: properties of the source tree,
  # not of the OS running them, so they run once, on Linux. Line endings, the one thing Prettier could catch
  # per OS, are pinned by `.gitattributes`. The test suites run in `test` and `coverage` below.
  check:
    needs: changes
    runs-on: ubuntu-latest
    env:
      WIREBENCH_REQUIRE_GIT: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:static
      - run: pnpm test:perf
      # The tests of the doc checks and of the landing site read `docs/` and `site/`: a documentation-only
      # change, which skips `test` and `coverage`, still runs them here.
      - name: The tests that read docs and the site
        if: needs.changes.outputs.code != 'true'
        run: pnpm vitest run --project scripts --project site

  # The unit and integration suite (`pnpm test`) on Windows, and on macOS for pushes to `main`, split into shards. Linux's run of the
  # same suite is `coverage` below, which runs every test too, under coverage. Each shard builds the engine,
  # whose `dist/` the tests import (and `tsc -b` builds the packages it references), the same build
  # `test:coverage` starts with; the full type build runs once, in `check`, since `tsc` does not answer
  # differently per OS. The perf budgets run on the first shard, after its tests, with the runner to themselves.
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      # macOS runs the suite on pushes to `main` only. The plan's five macOS runners at once are the limit on a
      # run's wall-clock, and on a pull request they go to the e2e shards, which macOS alone can check (the
      # committed screenshots); a macOS-only unit-test regression then shows on `main` instead. Expressions
      # cannot reach `strategy.matrix.include` entry by entry, hence the two lists as JSON.
      matrix:
        # Pull requests: Windows only. Pushes to main: macOS too.
        include: ${{ fromJSON(github.event_name == 'push' && '[{"os":"macos-latest","shard":"1/2"},{"os":"macos-latest","shard":"2/2"},{"os":"windows-latest","shard":"1/4"},{"os":"windows-latest","shard":"2/4"},{"os":"windows-latest","shard":"3/4"},{"os":"windows-latest","shard":"4/4"}]' || '[{"os":"windows-latest","shard":"1/4"},{"os":"windows-latest","shard":"2/4"},{"os":"windows-latest","shard":"3/4"},{"os":"windows-latest","shard":"4/4"}]') }}
    runs-on: ${{ matrix.os }}
    env:
      WIREBENCH_REQUIRE_GIT: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wirebench/engine build
      # `pnpm run`, not `pnpm test`: pnpm's own `test` command refuses options it does not know, such as `--shard`.
      - run: pnpm run test --shard=${{ matrix.shard }}
      - if: startsWith(matrix.shard, '1/')
        run: pnpm test:perf

  # The unit and integration suite on Linux, under v8 coverage, split into shards. A shard covers only part of
  # the suite, so it skips the 85% thresholds (`WIREBENCH_COVERAGE_SHARD`, see `vitest.config.ts`) and writes
  # a blob report; `coverage-report` merges the blobs and holds the whole suite to the thresholds.
  coverage:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    runs-on: ubuntu-latest
    env:
      WIREBENCH_REQUIRE_GIT: '1'
      WIREBENCH_COVERAGE_SHARD: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage --shard=${{ matrix.shard }} --reporter=default --reporter=blob
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-blob-${{ strategy.job-index }}
          path: .vitest/blob
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # The coverage shards' blobs, merged: the test results once more, and the coverage of the whole suite
  # against the thresholds in `vitest.config.ts`.
  coverage-report:
    needs: [changes, coverage]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-blob-*
          path: .vitest/blob
          merge-multiple: true
      - run: pnpm vitest run --merge-reports --coverage

  # The server's integration suite needs a real PostgreSQL. `check` runs the same files with the
  # database unset (they skip, saying so); this job runs them for real, once, on Linux.
  server-integration:
    needs: changes
    if: needs.changes.outputs.server_integration == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wirebench
          POSTGRES_PASSWORD: wirebench
          POSTGRES_DB: wirebench_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wirebench" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      WIREBENCH_REQUIRE_GIT: '1'
      WIREBENCH_SERVER_TEST_DATABASE_URL: postgres://wirebench:wirebench@127.0.0.1:5432/wirebench_test
      # Without the URL the suites would skip and the job pass green; this makes that a failure instead.
      WIREBENCH_SERVER_REQUIRE_DB: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # The suite connects as two roles (hosted edition spec §19.4, §19.13): wirebench_owner owns each
      # file's schema and runs its migrations, wirebench_app runs the queries. Neither is a superuser or
      # bypasses row-level security, and tenancy/role.test.ts fails if that ever changes. A third,
      # wirebench_control, is the hosted control plane's BYPASSRLS role (§22.2), which only a superuser may
      # create; only tenancy/control-role.test.ts connects as it. The superuser above only creates the roles
      # and creates and drops the schemas. The script is idempotent.
      - name: Create the test database roles
        run: docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U wirebench -d wirebench_test < scripts/ci/server-test-roles.sql
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wirebench/engine... build
      - run: pnpm --filter @wirebench/server test
      # The tenancy migration over a scaled fixture (hosted edition spec §19.10): it loads about 3 GB, so it
      # runs here, where the database is, and only on request elsewhere. Its gate is relative to a reference
      # build timed in the same run, so a slower runner does not fail it.
      - name: The tenancy migration's rates
        # Loading the scaled fixture has never run on a hosted runner; a hang must not hold the job for hours.
        timeout-minutes: 45
        run: pnpm vitest run --project server-perf
        env:
          WIREBENCH_PERF_TENANCY: '1'

  # Kerberos against a real MIT KDC (#40): the real binding and the real GSSAPI, end to end. `check`
  # runs the same file with WIREBENCH_KERBEROS_TESTS unset (it skips, saying so); this job builds a
  # throwaway realm and runs it for real, once, on Linux.
  kerberos-integration:
    # A short job: it starts after `check` (see `jobs`).
    needs: [changes, check]
    if: ${{ !cancelled() && needs.changes.outputs.kerberos_integration == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y krb5-kdc krb5-admin-server krb5-user libkrb5-dev
      - run: bash scripts/ci/kerberos-kdc.sh
      - run: pnpm install --frozen-lockfile
      - run: WIREBENCH_KERBEROS_TESTS=1 pnpm vitest run --project engine-integration packages/engine/test/integration/auth/kerberos-real.test.ts

  wss-xmlsec:
    # A short job: it starts after `check` (see `jobs`).
    needs: [changes, check]
    if: ${{ !cancelled() && needs.changes.outputs.wss_xmlsec == 'true' }}
    strategy:
      # One OS's toolchain failing must not hide the other's result.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install xmlsec1 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xmlsec1
      - name: Install xmlsec1 (macOS)
        if: runner.os == 'macOS'
        run: brew install libxmlsec1
      - run: WIREBENCH_REQUIRE_XMLSEC=1 pnpm test:wss-xmlsec

  # The e2e matrix runs on all three OSes, split into shards with Playwright's `--shard`. The theme *screenshot*
  # comparison happens on macOS only: only the macOS snapshots are committed (see e2e/specs/a11y.spec.ts), and
  # those two tests skip themselves elsewhere. Everything else in the suite runs everywhere. The startup and
  # interaction budgets (`perf.spec.ts`, the `electron-perf` project) are timing assertions, so they run on the
  # first shard only, after its other specs, with the runner to themselves.
  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    strategy:
      # One OS failing must not cancel the others: a Windows-only regression has to be
      # visible even when the macOS screenshot comparison is unhappy, and vice versa.
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, shard: '1/2' }
          - { os: ubuntu-latest, shard: '2/2' }
          - { os: macos-latest, shard: '1/4' }
          - { os: macos-latest, shard: '2/4' }
          - { os: macos-latest, shard: '3/4' }
          - { os: macos-latest, shard: '4/4' }
          - { os: windows-latest, shard: '1/3' }
          - { os: windows-latest, shard: '2/3' }
          - { os: windows-latest, shard: '3/3' }
    runs-on: ${{ matrix.os }}
    # The shared-workspace specs drive the system git; every hosted runner ships one, and this
    # makes a runner that does not fail loudly instead of quietly skipping.
    env:
      WIREBENCH_REQUIRE_GIT: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # mosh: the Mosh spec runs a real mosh-server and mosh-client; elsewhere it skips. socat: the serial
      # console spec opens one end of a virtual serial line; elsewhere it skips.
      - name: Install xvfb, mosh and socat
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb mosh socat
      # The hosted Windows runner's screen is 1024x768, which clamps the 1280x820 test window: the
      # REST editor then stacks and the console starts collapsed, as they should on a screen that
      # small, and the specs written for the default window lose their layout.
      - name: Give the Windows runner a 1920x1080 screen
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
      # Linux has no display: xvfb gives it one.
      - name: Run e2e
        env:
          XVFB: ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }}
        run: $XVFB pnpm --filter @wirebench/e2e exec playwright test --project electron --shard=${{ matrix.shard }}
      - name: Run the e2e perf budgets
        if: startsWith(matrix.shard, '1/')
        env:
          XVFB: ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }}
        run: $XVFB pnpm --filter @wirebench/e2e exec playwright test --project electron-perf --no-deps
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.os }}-${{ strategy.job-index }}
          path: e2e/playwright-report
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}-${{ strategy.job-index }}
          path: e2e/test-results

  # The browser client end to end (hosted edition spec §17.7): builds the server image, which carries the
  # browser build, starts it beside PostgreSQL and an echo service (e2e/browser/compose.yaml), and runs
  # the Playwright suite in headless Chromium. The image goes through buildx with the Actions cache (the
  # `server-image` scope, which server-upgrade shares from the same context), then compose starts the
  # loaded tag without building again.
  #
  # It runs twice: on an empty database (`fresh`), and on a migrated server (`migrated`, spec §19.13), where the
  # frozen 0019 fixture is loaded into the database and the data volume first, so the server's first start
  # upgrades a team install (0020, 0021, the data directory's move, the re-seal) before the same suite runs.
  browser-e2e:
    # A short job: it starts after `check` (see `jobs`).
    needs: [changes, check]
    if: ${{ !cancelled() && needs.changes.outputs.browser_e2e == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        start: [fresh, migrated]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # Global setup seeds the server with the engine's own writers, which run from its build.
      - run: pnpm --filter @wirebench/engine build
      # Global setup also runs the headless `wirebench agent` on the runner, outside Docker, from the built
      # CLI and its agent bundle (spec §18.7); the suite pairs it through the tab and sends to the runner's
      # own 127.0.0.1 through it. Teardown stops it.
      - run: pnpm --filter @wirebench/cli build
      # desktop-agent.spec.ts pairs the built desktop app as this machine's agent (spec §13.2 criterion 2),
      # launched through Playwright's `_electron`.
      - run: pnpm --filter "@wirebench/desktop..." build
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          load: true
          push: false
          platforms: linux/amd64
          tags: wirebench-server:browser-e2e
          cache-from: type=gha,scope=server-image
          cache-to: type=gha,scope=server-image,mode=max
      # Fresh: a secrets key made for this run only, which encrypts nothing that outlives `down -v`. Migrated: the
      # fixture's own test key, which its sealed values are under. `--free-seats` disables three fixture accounts: the
      # fixture's test-signed license is invalid under the image's production keys, so the server has the five
      # community seats, which the fixture's accounts fill, and the suite invites three more (its admin and two
      # plain accounts).
      - name: Start the stack
        env:
          START: ${{ matrix.start }}
        run: |
          compose=(docker compose -f e2e/browser/compose.yaml)
          if [ "$START" = migrated ]; then
            WIREBENCH_E2E_SECRETS_KEY="$(node -p "require('./packages/server/test/fixtures/tenancy/fixture-0019.json').keys.secretsKey")"
            "${compose[@]}" up -d --no-build --wait db echo
            node packages/server/test/fixtures/tenancy/volume.ts --free-seats -- -f e2e/browser/compose.yaml
          else
            WIREBENCH_E2E_SECRETS_KEY="$(openssl rand -base64 32)"
          fi
          echo "::add-mask::$WIREBENCH_E2E_SECRETS_KEY"
          echo "WIREBENCH_E2E_SECRETS_KEY=$WIREBENCH_E2E_SECRETS_KEY" >> "$GITHUB_ENV"
          export WIREBENCH_E2E_SECRETS_KEY
          "${compose[@]}" up -d --no-build --wait
          if [ "$START" = migrated ]; then
            # The upgrade finished: the latest schema (the highest migration on disk), the move and the re-seal
            # done, and queries as wirebench_app.
            sql() { "${compose[@]}" exec -T db psql -U wirebench -d wirebench -tAc "$1"; }
            latest="$(ls packages/server/migrations/*/*.sql | sed -E 's#.*/0*([0-9]+)_[^/]*\.sql$#\1#' | sort -n | tail -1)"
            test "$(sql 'select max(version) from schema_migrations')" = "$latest"
            test "$(sql 'select tenancy_step from server_identity')" = 'done'
            test "$(sql "select count(*) from pg_stat_activity where usename = 'wirebench_app'")" -gt 0
          fi
      - run: pnpm --filter @wirebench/e2e exec playwright install chromium --with-deps
      # The desktop app needs a display (xvfb) and, to seal its agent key, the Secret Service: an unlocked
      # gnome-keyring in a D-Bus session. The spec sets XDG_CURRENT_DESKTOP=GNOME, without which Chromium uses
      # its plain-text store and the app refuses to pair.
      # libsecret is the library Chromium reaches the Secret Service through; without it the app falls back
      # to its plain-text store whatever keyring runs.
      - name: Install xvfb, gnome-keyring and libsecret
        run: sudo apt-get update && sudo apt-get install -y xvfb gnome-keyring dbus-x11 libsecret-1-0 libsecret-tools
      - name: Run the browser suite
        env:
          WIREBENCH_E2E_REQUIRE_DESKTOP: '1'
        # The keyring must answer before the suite starts: storing and reading back one value proves the
        # Secret Service is up and its default collection unlocked, so a later refusal to pair is the app's.
        run: |
          dbus-run-session -- sh -c '
            set -e
            echo -n e2e | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            echo -n probe | secret-tool store --label=wirebench-e2e-probe service wirebench-e2e
            test "$(secret-tool lookup service wirebench-e2e)" = probe
            echo "keyrings: $(ls ~/.local/share/keyrings 2>&1 | tr "\n" " ") bus: ${DBUS_SESSION_BUS_ADDRESS:-none}"
            xvfb-run -a pnpm test:e2e:browser
          '
      - name: Stack logs
        if: failure()
        run: docker compose -f e2e/browser/compose.yaml logs --no-color --tail=200
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-browser-${{ matrix.start }}
          path: |
            e2e/browser/playwright-report
            e2e/browser/test-results
      - name: Stop the stack
        if: always()
        run: docker compose -f e2e/browser/compose.yaml down -v

  # Upgrading a compose installation at 0019 under this build (plan Task 29): the contributors' compose file with its
  # two URLs, the old single URL, and the team install's root docker-compose.yml with its new `.env` line, each on the
  # frozen fixture (upgrade-compose.test.ts). Then the way back: the image built at 0019's commit starts on what
  # `admin tenancy revert` leaves (revert-0019-image.test.ts). Both skip everywhere else, for want of the images.
  server-upgrade:
    # A short job: it starts after `check` (see `jobs`).
    needs: [changes, check]
    if: ${{ !cancelled() && needs.changes.outputs.server_upgrade == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wirebench
          POSTGRES_PASSWORD: wirebench
          POSTGRES_DB: wirebench_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wirebench" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      WIREBENCH_REQUIRE_GIT: '1'
      WIREBENCH_SERVER_TEST_DATABASE_URL: postgres://wirebench:wirebench@127.0.0.1:5432/wirebench_test
      WIREBENCH_SERVER_REQUIRE_DB: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Create the test database roles
        run: docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U wirebench -d wirebench_test < scripts/ci/server-test-roles.sql
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: pnpm --filter @wirebench/engine... build
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          load: true
          push: false
          platforms: linux/amd64
          tags: wirebench-server:upgrade
          cache-from: type=gha,scope=server-image
          cache-to: type=gha,scope=server-image,mode=max
      # The last commit at schema 0019, which the frozen fixture was generated at (test/fixtures/tenancy/). Checked
      # out after this build's image, so the build context above is the same as browser-e2e's and their shared
      # cache scope holds one `COPY . .` layer; .dockerignore leaves it out as well.
      - uses: actions/checkout@v7
        with:
          ref: e9bdc5af1b7af8ecf2e47aed0d6a919040a6497b
          path: old-0019
          persist-credentials: false
      - uses: docker/build-push-action@v6
        with:
          context: old-0019
          file: old-0019/packages/server/Dockerfile
          load: true
          push: false
          platforms: linux/amd64
          tags: wirebench-server:0019
          cache-from: type=gha,scope=server-image-0019
          cache-to: type=gha,scope=server-image-0019,mode=max
      - run: pnpm vitest run --project server-integration packages/server/test/integration/tenancy/upgrade-compose.test.ts packages/server/test/integration/tenancy/revert-0019-image.test.ts
        env:
          WIREBENCH_SERVER_UPGRADE_IMAGE: wirebench-server:upgrade
          WIREBENCH_SERVER_0019_IMAGE: wirebench-server:0019
          # The default bridge's gateway: the service's published port, as a container on this runner reaches it.
          WIREBENCH_SERVER_0019_IMAGE_DB_HOST: 172.17.0.1

  # The tenancy suites, revert round trip included, on the other supported PostgreSQL majors (Task 28 review m7):
  # 15 is the oldest the server accepts, and server-integration above runs everything on 16.
  tenancy-postgres:
    # A short job: it starts after `check` (see `jobs`).
    needs: [changes, check]
    if: ${{ !cancelled() && needs.changes.outputs.tenancy_postgres == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        postgres: ['15', '17', '18']
    runs-on: ubuntu-latest
    # The suite takes minutes; a lock wait or a revert waiting on sessions that hangs fails here, not at 6 h.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: wirebench
          POSTGRES_PASSWORD: wirebench
          POSTGRES_DB: wirebench_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wirebench" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      WIREBENCH_REQUIRE_GIT: '1'
      WIREBENCH_SERVER_TEST_DATABASE_URL: postgres://wirebench:wirebench@127.0.0.1:5432/wirebench_test
      WIREBENCH_SERVER_REQUIRE_DB: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Create the test database roles
        run: docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U wirebench -d wirebench_test < scripts/ci/server-test-roles.sql
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wirebench/engine... build
      - run: pnpm vitest run --project server-integration packages/server/test/integration/tenancy/

  # The hosted server end to end (hosted edition spec §22.17, slice 7 Task 33): started from a hosted environment
  # through `loadConfig` and `serve`, as an operator starts one, on a real listener with the three roles, mail through
  # a local SMTP sink, and a fake Paddle posting webhook fixtures signed with a placeholder secret as Paddle documents
  # (`Paddle-Signature: ts=…;h1=…`). Signup, payment, sign-in, suspension, the operator's export (verified offline)
  # and the deletion. The test skips without WIREBENCH_SERVER_HOSTED_E2E, so server-integration does not run it twice.
  # No real Paddle account, key or domain is involved; the first sandbox run is
  # docs/manual-tests/2026-11-04-paddle-sandbox.md.
  hosted-e2e:
    # A short job: it starts after `check` (see `jobs`).
    needs: [changes, check]
    if: ${{ !cancelled() && needs.changes.outputs.hosted_e2e == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wirebench
          POSTGRES_PASSWORD: wirebench
          POSTGRES_DB: wirebench_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wirebench" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      WIREBENCH_REQUIRE_GIT: '1'
      WIREBENCH_SERVER_TEST_DATABASE_URL: postgres://wirebench:wirebench@127.0.0.1:5432/wirebench_test
      WIREBENCH_SERVER_REQUIRE_DB: '1'
      WIREBENCH_SERVER_HOSTED_E2E: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # The owner, the app role and the control role (§19.4, §22.2): only a superuser may create the last.
      - name: Create the test database roles
        run: docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U wirebench -d wirebench_test < scripts/ci/server-test-roles.sql
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: pnpm --filter @wirebench/engine... build
      - run: pnpm vitest run --project server-integration packages/server/test/integration/control-plane/hosted-e2e.test.ts packages/server/test/integration/control-plane/hosted-serve.test.ts
      # The recipe itself parses with its new variables, placeholders only (the parse test also runs in `test`).
      - run: pnpm vitest run --project server-unit packages/server/test/unit/deploy-hosted.test.ts

  # Builds the container image the way a release tag will and proves it actually runs a
  # project: `docker run --version` sanity-checks the entrypoint, then `cli:smoke --via docker`
  # runs the same four checks the other recipes run (packages/cli/Dockerfile, task 3 of #31);
  # `--mock` then serves a mock from the image and stops it with `docker stop` (#61).
  image-smoke:
    # A short job: it starts after `check` (see `jobs`).
    needs: [changes, check]
    if: ${{ !cancelled() && needs.changes.outputs.image_smoke == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/cli/Dockerfile
          load: true
          push: false
          platforms: linux/amd64
          tags: wirebench-cli:ci
      - run: docker run --rm wirebench-cli:ci --version
      - run: pnpm cli:smoke --via docker --image wirebench-cli:ci
      - run: pnpm cli:smoke --via docker --image wirebench-cli:ci --gitlab
      - run: pnpm cli:smoke --via docker --image wirebench-cli:ci --mock

  # Proves the npm recipe end to end: pack both packages the way a release would, install the
  # tarballs into an empty directory (no workspace, no `workspace:*` protocol to fall back on),
  # then run the same four checks against that install (packages/cli, task 1 of #31).
  npm-smoke:
    needs: changes
    if: needs.changes.outputs.npm_smoke == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm cli:smoke --via npm

  # Proves the GitHub Action end to end, against the packed tarballs rather than a published
  # `@wirebench/cli` (nothing is published yet, and `npx` cannot resolve an unpublished
  # `@wirebench/engine` from a tarball on its own — see action/action.yml's `WB_PACKAGES`
  # override). One project run against the fixture's passing selection must exit 0 and leave a
  # JUnit file; the same run against the failing selection must exit 1, without failing this job
  # (`continue-on-error`) since a red assertion is the expected outcome under test.
  action-smoke:
    needs: changes
    if: needs.changes.outputs.action_smoke == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Pack tarballs
        id: pack
        run: node scripts/pack-check.ts "${{ runner.temp }}/pkgs"

      - name: Start the demo server
        id: serve
        run: |
          nohup node scripts/cli-smoke.ts --serve-only > "${{ runner.temp }}/serve.log" 2>&1 &
          disown
          for _ in $(seq 1 100); do
            if [ -f "$GITHUB_OUTPUT" ] && grep -q '^url=' "$GITHUB_OUTPUT"; then
              exit 0
            fi
            sleep 0.2
          done
          echo "demo server did not report a url in time" >&2
          cat "${{ runner.temp }}/serve.log" >&2
          exit 1

      - name: Passing selection
        id: pass
        uses: ./action
        with:
          project: packages/cli/test/fixtures/runner-project
          env: local
          select: demo/ok
          vars: baseUrl=${{ steps.serve.outputs.url }}
          junit: out/pass.xml
        env:
          WB_PACKAGES: |
            ${{ steps.pack.outputs.engine }}
            ${{ steps.pack.outputs.cli }}

      - name: Failing selection
        id: fail
        continue-on-error: true
        uses: ./action
        with:
          project: packages/cli/test/fixtures/runner-project
          env: local
          select: demo/broken
          vars: baseUrl=${{ steps.serve.outputs.url }}
        env:
          WB_PACKAGES: |
            ${{ steps.pack.outputs.engine }}
            ${{ steps.pack.outputs.cli }}

      - name: Check outcomes
        run: |
          if [ "${{ steps.pass.outputs.exit-code }}" != "0" ]; then
            echo "expected the passing selection to exit 0, got ${{ steps.pass.outputs.exit-code }}" >&2
            exit 1
          fi
          # A failed composite step may not surface its outputs, so the failing case accepts an
          # empty exit-code as long as the step's outcome is failure; any other code fails.
          if [ "${{ steps.fail.outcome }}" != "failure" ]; then
            echo "expected the failing selection's outcome to be failure, got ${{ steps.fail.outcome }}" >&2
            exit 1
          fi
          fail_code="${{ steps.fail.outputs.exit-code }}"
          if [ -n "$fail_code" ] && [ "$fail_code" != "1" ]; then
            echo "expected the failing selection to exit 1, got $fail_code" >&2
            exit 1
          fi
          if [ ! -f out/pass.xml ]; then
            echo "expected out/pass.xml to exist" >&2
            exit 1
          fi
