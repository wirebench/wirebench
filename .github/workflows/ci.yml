name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      WIREBENCH_REQUIRE_GIT: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Lint, formatting, the generated-docs, contrast, doc-path, banned-term and licence checks
      # are properties of the source tree, not of the OS running them: they run once, on Linux
      # (`pnpm check`). macOS and Windows run what can actually differ there — the type build
      # and the test suites (`pnpm check:tests`). Line endings, the one thing Prettier could
      # catch per OS, are pinned by `.gitattributes`.
      - run: ${{ matrix.os == 'ubuntu-latest' && 'pnpm check' || 'pnpm check:tests' }}

  # The jobs below do not wait for `check`: each fails on its own, and serialising them behind
  # the slowest check runner only stretched the wall-clock — a red `check` never made a green
  # e2e result less informative, and vice versa.

  # Coverage runs once, on Linux only: it re-executes the engine's unit/integration suite under
  # v8 coverage instrumentation, which is slower than the plain run `check` already did on every
  # OS above, and the 85% thresholds (`vitest.config.ts`) are a property of the engine's source
  # and tests, not of the OS running them.
  coverage:
    runs-on: ubuntu-latest
    env:
      WIREBENCH_REQUIRE_GIT: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage

  wss-xmlsec:
    strategy:
      # One OS's toolchain failing must not hide the other's result.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install xmlsec1 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xmlsec1
      - name: Install xmlsec1 (macOS)
        if: runner.os == 'macOS'
        run: brew install libxmlsec1
      - run: WIREBENCH_REQUIRE_XMLSEC=1 pnpm test:wss-xmlsec

  # The e2e matrix runs on all three OSes, but the theme *screenshot* comparison happens on
  # macOS only: only the macOS snapshots are committed (see e2e/specs/a11y.spec.ts), and those
  # two tests skip themselves elsewhere. Everything else in the suite runs everywhere.
  e2e:
    strategy:
      # One OS failing must not cancel the others: a Windows-only regression has to be
      # visible even when the macOS screenshot comparison is unhappy, and vice versa.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The shared-workspace specs drive the system git; every hosted runner ships one, and this
    # makes a runner that does not fail loudly instead of quietly skipping.
    env:
      WIREBENCH_REQUIRE_GIT: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run e2e (Linux, headless via xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:e2e
      - name: Run e2e
        if: runner.os != 'Linux'
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.os }}
          path: e2e/playwright-report
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: e2e/test-results

  # Builds the container image the way a release tag will and proves it actually runs a
  # project: `docker run --version` sanity-checks the entrypoint, then `cli:smoke --via docker`
  # runs the same four checks the other recipes run (packages/cli/Dockerfile, task 3 of #31).
  image-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/cli/Dockerfile
          load: true
          push: false
          platforms: linux/amd64
          tags: wirebench-cli:ci
      - run: docker run --rm wirebench-cli:ci --version
      - run: pnpm cli:smoke --via docker --image wirebench-cli:ci
      - run: pnpm cli:smoke --via docker --image wirebench-cli:ci --gitlab

  # Proves the npm recipe end to end: pack both packages the way a release would, install the
  # tarballs into an empty directory (no workspace, no `workspace:*` protocol to fall back on),
  # then run the same four checks against that install (packages/cli, task 1 of #31).
  npm-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm cli:smoke --via npm

  # Proves the GitHub Action end to end, against the packed tarballs rather than a published
  # `@wirebench/cli` (nothing is published yet, and `npx` cannot resolve an unpublished
  # `@wirebench/engine` from a tarball on its own — see action/action.yml's `WB_PACKAGES`
  # override). One project run against the fixture's passing selection must exit 0 and leave a
  # JUnit file; the same run against the failing selection must exit 1, without failing this job
  # (`continue-on-error`) since a red assertion is the expected outcome under test.
  action-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Pack tarballs
        id: pack
        run: node scripts/pack-check.ts "${{ runner.temp }}/pkgs"

      - name: Start the demo server
        id: serve
        run: |
          nohup node scripts/cli-smoke.ts --serve-only > "${{ runner.temp }}/serve.log" 2>&1 &
          disown
          for _ in $(seq 1 100); do
            if [ -f "$GITHUB_OUTPUT" ] && grep -q '^url=' "$GITHUB_OUTPUT"; then
              exit 0
            fi
            sleep 0.2
          done
          echo "demo server did not report a url in time" >&2
          cat "${{ runner.temp }}/serve.log" >&2
          exit 1

      - name: Passing selection
        id: pass
        uses: ./action
        with:
          project: packages/cli/test/fixtures/runner-project
          env: local
          select: demo/ok
          vars: baseUrl=${{ steps.serve.outputs.url }}
          junit: out/pass.xml
        env:
          WB_PACKAGES: |
            ${{ steps.pack.outputs.engine }}
            ${{ steps.pack.outputs.cli }}

      - name: Failing selection
        id: fail
        continue-on-error: true
        uses: ./action
        with:
          project: packages/cli/test/fixtures/runner-project
          env: local
          select: demo/broken
          vars: baseUrl=${{ steps.serve.outputs.url }}
        env:
          WB_PACKAGES: |
            ${{ steps.pack.outputs.engine }}
            ${{ steps.pack.outputs.cli }}

      - name: Check outcomes
        run: |
          if [ "${{ steps.pass.outputs.exit-code }}" != "0" ]; then
            echo "expected the passing selection to exit 0, got ${{ steps.pass.outputs.exit-code }}" >&2
            exit 1
          fi
          # A failed composite step may not surface its outputs, so the failing case accepts an
          # empty exit-code as long as the step's outcome is failure; any other code fails.
          if [ "${{ steps.fail.outcome }}" != "failure" ]; then
            echo "expected the failing selection's outcome to be failure, got ${{ steps.fail.outcome }}" >&2
            exit 1
          fi
          fail_code="${{ steps.fail.outputs.exit-code }}"
          if [ -n "$fail_code" ] && [ "$fail_code" != "1" ]; then
            echo "expected the failing selection to exit 1, got $fail_code" >&2
            exit 1
          fi
          if [ ! -f out/pass.xml ]; then
            echo "expected out/pass.xml to exist" >&2
            exit 1
          fi
