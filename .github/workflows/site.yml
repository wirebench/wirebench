name: Site

# Builds the landing site and the documentation site and publishes them to GitHub Pages.
#
# Every push to main deploys, with no path filter: the command reference and the screenshots are
# generated from app code, so a change outside site/ or docs-site/ can change either package. The artifact is the
# landing site with the user guide under /docs. Pull requests that touch the site build it without
# deploying, which is where a broken internal link fails.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'site/**'
      - 'docs-site/**'
      - 'scripts/site-assemble.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A deploy half-way through is left to finish; a superseded pull-request build is not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm site:assemble
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
