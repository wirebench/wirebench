name: Docs

# The checks a Markdown change can fail, run on their own so a docs-only change does not wait on the
# full CI matrix (`ci.yml` ignores Markdown-only changes). These are the Markdown-facing parts of
# `pnpm check`: Prettier, the generated docs (`--check` fails when a hand edit drifts from the
# source they are generated from), the paths and images the docs cite, and the banned terms.
# A change that also touches code runs this alongside `ci.yml`, whose `pnpm check` repeats it.
on:
  push:
    branches: [main]
    paths: ['**/*.md', '**/*.mdx', '.github/workflows/docs.yml']
  pull_request:
    paths: ['**/*.md', '**/*.mdx', '.github/workflows/docs.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `wsi:docs` and `docs:script-api` render from the engine's build output.
      - run: pnpm --filter @wirebench/engine build
      - run: pnpm check:docs
