name: Release

# Tag-driven: `git tag v1.0.0 && git push --tags` builds the three OS artifact sets and
# collects them into a *draft* GitHub Release — that part stays a draft a human has to publish.
# The same tag also publishes the container image to GHCR and the npm packages, in the `image`
# and `npm` jobs below. A `workflow_dispatch` run rehearses both (build the image, pack the
# tarballs) without pushing or publishing anything.
on:
  push:
    tags: ['v*']
  # Same build, no release: for rehearsing a tag build before cutting one.
  workflow_dispatch:

# No workflow-wide write: only the `release` job below needs to create a release, so the
# three packaging jobs run with the default read-only token.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The same gate every push has to pass; a tag is not an excuse to ship something red. It runs
  # once — the three packaging jobs wait for it rather than each repeating it.
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: package:mac
            artifact: macos
          - os: ubuntu-latest
            script: package:linux
            artifact: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # rpm packaging needs rpmbuild and snap packaging needs mksquashfs; the Ubuntu runner
      # ships with neither.
      - name: Install Linux packaging tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm squashfs-tools

      # Signing is opt-in. electron-builder reads the certificates and the Apple credentials
      # out of the environment and skips signing (and notarization) when they are empty, so a
      # repository with none of these secrets set still produces working, *unsigned* artifacts.
      # The Developer ID certificate goes into a keychain of our own before packaging, and
      # electron-builder finds the identity there. Left to import `CSC_LINK` itself, it failed on
      # the macos-26 runners unlocking the temporary keychain it creates ("passphrase not
      # correct"), with no word about the certificate. Here a wrong .p12 password fails at the
      # import, saying so.
      - name: Import the signing certificate
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "No CSC_LINK: the macOS build is not signed."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 24)"
          printf '%s' "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -f pkcs12 -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          # Search this keychain first, and keep the runner's own after it.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain" | grep -q "Developer ID Application" || {
            echo "::error::The certificate in CSC_LINK is not a Developer ID Application identity."
            exit 1
          }
          echo "CSC_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Package
        env:
          # macOS signing + notarization. The identity comes from the keychain imported above;
          # electron-builder notarizes only when all three Apple variables are present, and with
          # none of them it skips notarization.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Never publish from the build job; the release job below attaches the artifacts.
          GH_TOKEN: ''
        # A secret that is not configured arrives as an empty string; electron-builder reads an
        # empty Apple variable as present, so anything empty is unset before packaging.
        run: |
          for name in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then unset "$name"; fi
          done
          pnpm ${{ matrix.script }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wirebench-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
            apps/desktop/release/*.snap
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml

  # Builds and (on a tag) pushes the CLI container image to GHCR. The rehearsal
  # (workflow_dispatch) builds it without logging in or pushing.
  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/wirebench/wirebench-cli
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/cli/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}

  # Publishes @wirebench/engine and @wirebench/cli to npm on a tag. The rehearsal
  # (workflow_dispatch) only packs and checks the tarballs.
  npm:
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wirebench/engine --filter @wirebench/cli build

      - name: Pack and check the tarballs (rehearsal)
        if: github.event_name == 'workflow_dispatch'
        run: pnpm pack:check

      - name: Publish
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${GITHUB_REF_NAME#v}"
          pnpm --filter @wirebench/engine --filter @wirebench/cli exec npm version "$v" --no-git-tag-version
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then dist=next; else dist=latest; fi
          pnpm publish -r --filter @wirebench/engine --filter @wirebench/cli --access public --tag "$dist" --no-git-checks

  # Windows is packaged in stages so that SignPath can sign the app before the installers are built
  # around it, then sign the installers: a fleet's application-control policy checks the installed
  # Wirebench.exe, not only the setup file. Each signing job passes its input through unsigned when
  # SIGNPATH_API_TOKEN is not configured, so the pipeline works before SignPath does.
  win-unpacked:
    needs: check
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `--dir` stops after packing: the unpacked apps, fuses already flipped by afterPack.
      - run: pnpm build && pnpm --filter @wirebench/desktop exec electron-builder --win --dir --x64 --arm64 --publish never
      - uses: actions/upload-artifact@v7
        id: upload
        with:
          name: win-app-unsigned
          if-no-files-found: error
          path: |
            apps/desktop/release/win-unpacked/
            apps/desktop/release/win-arm64-unpacked/
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}

  win-sign-app:
    needs: win-unpacked
    runs-on: ubuntu-latest
    # SignPath fetches the artifact through this job's token.
    permissions:
      actions: read
      contents: read
    steps:
      - name: Is SignPath configured?
        id: signpath
        env:
          TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: echo "enabled=$([ -n "$TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Sign the app with SignPath
        if: steps.signpath.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_APP_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ needs.win-unpacked.outputs.artifact-id }}
          wait-for-completion: true
          # Every request waits for a person to approve it in SignPath; a hosted job lives 6 hours.
          wait-for-completion-timeout-in-seconds: 18000
          output-artifact-directory: win-app
      - name: Pass the app through unsigned
        if: steps.signpath.outputs.enabled != 'true'
        uses: actions/download-artifact@v8
        with:
          name: win-app-unsigned
          path: win-app
      - uses: actions/upload-artifact@v7
        with:
          name: win-app
          if-no-files-found: error
          path: win-app/

  win-installers:
    needs: win-sign-app
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: win-app
          path: apps/desktop/prepackaged
      # One run per architecture: `--prepackaged` takes a single app. Each run writes a latest.yml
      # naming only its own installer, so arm64 builds into a directory of its own and is folded
      # into the x64 manifest below.
      - name: Build the installers around the (signed) app
        working-directory: apps/desktop
        run: |
          pnpm exec electron-builder --win nsis msi --x64 --prepackaged prepackaged/win-unpacked --publish never
          pnpm exec electron-builder --win nsis msi --arm64 --prepackaged prepackaged/win-arm64-unpacked \
            --config.directories.output=release-arm64 --publish never
          cp release-arm64/*.exe release-arm64/*.msi release-arm64/*.blockmap release/
      - uses: actions/upload-artifact@v7
        id: upload
        with:
          name: win-installers-unsigned
          if-no-files-found: error
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.msi
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}

  win-sign-installers:
    needs: win-installers
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Is SignPath configured?
        id: signpath
        env:
          TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: echo "enabled=$([ -n "$TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      # SignPath signs the .exe and .msi files and returns the rest of the artifact unchanged.
      - name: Sign the installers with SignPath
        if: steps.signpath.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLERS_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ needs.win-installers.outputs.artifact-id }}
          wait-for-completion: true
          # Every request waits for a person to approve it in SignPath; a hosted job lives 6 hours.
          wait-for-completion-timeout-in-seconds: 18000
          output-artifact-directory: windows
      - name: Pass the installers through unsigned
        if: steps.signpath.outputs.enabled != 'true'
        uses: actions/download-artifact@v8
        with:
          name: win-installers-unsigned
          path: windows
      # A signed installer's bytes differ from the ones its blockmap describes; without one, the
      # updater downloads the whole installer instead of the changed blocks, which is correct.
      - name: Drop blockmaps that signing made stale
        if: steps.signpath.outputs.enabled == 'true'
        run: rm -f windows/*.blockmap
      - name: Fold arm64 into latest.yml, and match it to the final installers
        run: |
          arm64="$(cd windows && ls *-windows-arm64-setup.exe)"
          node scripts/update-metadata.ts windows --add "$arm64"
          node scripts/update-metadata.ts windows --check
      - uses: actions/upload-artifact@v7
        with:
          name: wirebench-windows
          if-no-files-found: error
          path: windows/

  # A CycloneDX SBOM of what ships: the desktop app's production dependency tree, deployed on its
  # own so development tooling is not listed as part of the product.
  sbom:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy the production dependency tree
        run: |
          pnpm build
          # Hoisted, so every package is a real directory: Syft does not follow the symlinks of
          # pnpm's default layout, and would list almost nothing.
          pnpm --filter @wirebench/desktop deploy --prod --config.node-linker=hoisted sbom-root
          echo "version=$(node -p "require('./apps/desktop/package.json').version")" >> "$GITHUB_ENV"
      # On a directory, Syft reads lockfiles and CI files by default, and `pnpm deploy` writes no
      # lockfile: the installed-package cataloger is the one that reads what is actually there.
      - uses: anchore/sbom-action@v0
        env:
          SYFT_DEFAULT_CATALOGERS: javascript-package-cataloger
        with:
          path: sbom-root
          format: cyclonedx-json
          output-file: wirebench-${{ env.version }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@v7
        with:
          name: wirebench-sbom
          if-no-files-found: error
          path: wirebench-${{ env.version }}.cdx.json

  release:
    needs: [build, win-sign-installers, sbom]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The only job that writes: it creates the draft release and attaches the artifacts.
    # `id-token` and `attestations` let it sign the provenance of what it publishes.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      # Only what ships: the intermediate Windows artifacts (unpacked apps, unsigned installers)
      # are not named `wirebench-*`.
      - uses: actions/download-artifact@v8
        with:
          pattern: wirebench-*
          path: artifacts
          merge-multiple: true
      - name: Find the SBOM
        id: sbom
        run: echo "path=$(ls artifacts/*.cdx.json)" >> "$GITHUB_OUTPUT"

      # Provenance for every file in the release, and the SBOM bound to each installer, so anyone
      # can check a download with `gh attestation verify <file> --repo wirebench/wirebench`.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: artifacts/*
      - uses: actions/attest-sbom@v4
        with:
          subject-path: |
            artifacts/*.dmg
            artifacts/*.exe
            artifacts/*.msi
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.snap
          sbom-path: ${{ steps.sbom.outputs.path }}

      # The tag's own section of the changelog, when there is one; otherwise GitHub's
      # generated notes. Never invents a body.
      - name: Extract release notes
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -f CHANGELOG.md ]; then
            awk -v v="$version" '
              /^## / { if (found) exit; if (index($0, v)) { found = 1; next } }
              found { print }
            ' CHANGELOG.md > release-notes.md
          fi
          if [ ! -s release-notes.md ]; then
            echo "generate=true" >> "$GITHUB_OUTPUT"
          else
            echo "generate=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft release (changelog section)
        if: steps.notes.outputs.generate == 'false'
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          # A `-rc`/`-beta` tag is marked as a pre-release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release-notes.md
          files: artifacts/**/*

      - name: Create draft release (generated notes)
        if: steps.notes.outputs.generate == 'true'
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: artifacts/**/*
