name: Release

# Tag-driven: `git tag v1.0.0 && git push --tags` builds the three OS artifact sets and
# collects them into a *draft* GitHub Release — that part stays a draft a human has to publish.
# The same tag also publishes the container image to GHCR and the npm packages, in the `image`
# and `npm` jobs below. A `workflow_dispatch` run rehearses both (build the image, pack the
# tarballs) without pushing or publishing anything.
on:
  push:
    tags: ['v*']
  # Same build, no release: for rehearsing a tag build before cutting one.
  workflow_dispatch:

# No workflow-wide write: only the `release` job below needs to create a release, so the
# three packaging jobs run with the default read-only token.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The same gate every push has to pass; a tag is not an excuse to ship something red. It runs
  # once — the three packaging jobs wait for it rather than each repeating it.
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: package:mac
            artifact: macos
          - os: windows-latest
            script: package:win
            artifact: windows
          - os: ubuntu-latest
            script: package:linux
            artifact: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # rpm packaging needs rpmbuild and snap packaging needs mksquashfs; the Ubuntu runner
      # ships with neither.
      - name: Install Linux packaging tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm squashfs-tools

      # Signing is opt-in. electron-builder reads the certificates and the Apple credentials
      # out of the environment and skips signing (and notarization) when they are empty, so a
      # repository with none of these secrets set still produces working, *unsigned* artifacts.
      - name: Package
        env:
          # macOS signing + notarization. electron-builder notarizes only when all three
          # Apple variables are present; with none of them it skips both steps.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows code signing, when a certificate is configured.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          # Never publish from the build job; the release job below attaches the artifacts.
          GH_TOKEN: ''
        # A secret that is not configured arrives as an empty string, and electron-builder
        # treats an empty `CSC_LINK` as a certificate path (resolving to the project directory,
        # "not a file") rather than as absent — so anything empty is unset before packaging.
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then unset "$name"; fi
          done
          pnpm ${{ matrix.script }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wirebench-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
            apps/desktop/release/*.snap
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml

  # Builds and (on a tag) pushes the CLI container image to GHCR. The rehearsal
  # (workflow_dispatch) builds it without logging in or pushing.
  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/wirebench/wirebench-cli
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/cli/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}

  # Publishes @wirebench/engine and @wirebench/cli to npm on a tag. The rehearsal
  # (workflow_dispatch) only packs and checks the tarballs.
  npm:
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wirebench/engine --filter @wirebench/cli build

      - name: Pack and check the tarballs (rehearsal)
        if: github.event_name == 'workflow_dispatch'
        run: pnpm pack:check

      - name: Publish
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${GITHUB_REF_NAME#v}"
          pnpm --filter @wirebench/engine --filter @wirebench/cli exec npm version "$v" --no-git-tag-version
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then dist=next; else dist=latest; fi
          pnpm publish -r --filter @wirebench/engine --filter @wirebench/cli --access public --tag "$dist" --no-git-checks

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The only job that writes: it creates the draft release and attaches the artifacts.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # The tag's own section of the changelog, when there is one; otherwise GitHub's
      # generated notes. Never invents a body.
      - name: Extract release notes
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -f CHANGELOG.md ]; then
            awk -v v="$version" '
              /^## / { if (found) exit; if (index($0, v)) { found = 1; next } }
              found { print }
            ' CHANGELOG.md > release-notes.md
          fi
          if [ ! -s release-notes.md ]; then
            echo "generate=true" >> "$GITHUB_OUTPUT"
          else
            echo "generate=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft release (changelog section)
        if: steps.notes.outputs.generate == 'false'
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          # A `-rc`/`-beta` tag is marked as a pre-release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release-notes.md
          files: artifacts/**/*

      - name: Create draft release (generated notes)
        if: steps.notes.outputs.generate == 'true'
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: artifacts/**/*
