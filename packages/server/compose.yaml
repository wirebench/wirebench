services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: wirebench
      POSTGRES_PASSWORD: wirebench
      POSTGRES_DB: wirebench
    ports:
      - '127.0.0.1:${WIREBENCH_DB_PORT:-5432}:5432'
    volumes:
      - wirebench-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wirebench']
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  wirebench-db:
