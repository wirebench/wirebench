# Wirebench Server, hosted edition (hosted spec §21.5, ADR-0038): Traefik in front, the only public listener, with one
# Let's Encrypt certificate for <app-domain> and *.<app-domain> issued by ACME DNS-01 at Hetzner DNS; the server and
# PostgreSQL behind it, neither with a published port. A team's custom domain (spec §23.4) gets a certificate of its
# own by HTTP-01: Traefik polls the server's internal proxy listener for the names to route. README.md beside this file
# is the runbook.
#
# Three database roles (spec §19.4, §22.2): the owner `wirebench` (the image's superuser, which migrates), the app
# role `wirebench_app` (every query, under row-level security) and the control role `wirebench_control` (the control
# plane alone, past it). Create the last two once with `docker compose run --rm server admin tenancy role`; the
# README's "Starting" has the steps. Teams sign up and pay through Paddle (spec §22.5): the server only renders
# Paddle.js's checkout and receives its signed webhooks, and holds no Paddle API key.
#
# Settings go in `.env` beside this file (`env.example` lists them; copy it to `.env`), the Hetzner DNS API token in
# `secrets/hetzner_api_token` and the Paddle notification destination's secret in `secrets/paddle_webhook_secret`,
# each mode 600; the Paddle one owned by uid 1000 (the server image's `node` user), as compose mounts a file secret
# with the host's owner and mode. Then `docker compose up -d`.
#
# `PROXY_TOKEN` in `.env` is the proxy listener's bearer token. Traefik's HTTP provider takes a header value, not a file,
# so compose puts it into the header and also hands it to the server as the `proxy_token` secret: one value, two readers.
name: wirebench-hosted

services:
  traefik:
    image: traefik:v3.7.17
    restart: unless-stopped
    command:
      - --providers.file.filename=/etc/traefik/dynamic.yaml
      - --providers.file.watch=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?set ACME_EMAIL in .env}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.caserver=${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      - --certificatesresolvers.le.acme.dnschallenge.provider=hetzner
      - --certificatesresolvers.le.acme.dnschallenge.resolvers=1.1.1.1:53,9.9.9.9:53
      # Custom domains (spec §23.4): one certificate per verified name, by HTTP-01 on `web`, whose challenge router
      # Traefik puts ahead of the redirect above. Same storage, contact and CA as `le`.
      - --certificatesresolvers.le-http.acme.email=${ACME_EMAIL:?set ACME_EMAIL in .env}
      - --certificatesresolvers.le-http.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le-http.acme.caserver=${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      - --certificatesresolvers.le-http.acme.httpchallenge.entrypoint=web
      # The routers for those names, from the server's internal listener, which no public router points at.
      - --providers.http.endpoint=http://server:8081/proxy/traefik
      - --providers.http.pollInterval=10s
      - --providers.http.headers.Authorization=Bearer ${PROXY_TOKEN:?set PROXY_TOKEN in .env}
      - --log.level=INFO
    environment:
      # Read by the dynamic file's templates.
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env}
      # lego's hetzner provider reads the token from this file; it never appears in the environment.
      HETZNER_API_TOKEN_FILE: /run/secrets/hetzner_api_token
    secrets:
      - hetzner_api_token
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./dynamic.yaml:/etc/traefik/dynamic.yaml:ro
      - letsencrypt:/letsencrypt

  server:
    image: ghcr.io/wirebench/wirebench-server:${WIREBENCH_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: server.env
        required: false
    environment:
      WIREBENCH_SERVER_MODE: hosted
      WIREBENCH_SERVER_APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env}
      WIREBENCH_SERVER_SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in .env}
      WIREBENCH_SERVER_PUBLIC_URL: https://app.${APP_DOMAIN}
      WIREBENCH_SERVER_MIGRATION_DATABASE_URL: postgres://wirebench:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/wirebench
      WIREBENCH_SERVER_DATABASE_URL: postgres://wirebench_app:${WIREBENCH_APP_DB_PASSWORD:?set WIREBENCH_APP_DB_PASSWORD in .env}@db:5432/wirebench
      # The control plane's own role (spec §22.2), the one past row-level security; a password apart from the app's.
      WIREBENCH_SERVER_CONTROL_DATABASE_URL: postgres://wirebench_control:${WIREBENCH_CONTROL_DB_PASSWORD:?set WIREBENCH_CONTROL_DB_PASSWORD in .env}@db:5432/wirebench
      # Hosted mode is always several instances' kind (spec §20.1): this one's address on the compose network.
      WIREBENCH_SERVER_INSTANCE_URL: http://server:8091
      # Traefik is the only way in, so its X-Forwarded-Host and X-Forwarded-For are the request's.
      WIREBENCH_SERVER_TRUST_PROXY: 'true'
      WIREBENCH_SERVER_BROWSER_CLIENT: 'true'
      WIREBENCH_SERVER_SECRETS_KEY: ${WIREBENCH_SECRETS_KEY:?set WIREBENCH_SECRETS_KEY in .env}
      # Each team's audit chain is sealed under a key derived from this one (spec §19.7), so its export verifies offline.
      WIREBENCH_SERVER_AUDIT_CHAIN_KEY: ${WIREBENCH_AUDIT_CHAIN_KEY:?set WIREBENCH_AUDIT_CHAIN_KEY in .env}
      # app.<app-domain> mails people the links of their teams (spec §21.4).
      WIREBENCH_SERVER_SMTP_URL: ${SMTP_URL:?set SMTP_URL in .env}
      WIREBENCH_SERVER_SMTP_FROM: ${SMTP_FROM:?set SMTP_FROM in .env}
      # Paddle (spec §22.5): `sandbox` with a `test_…` client token, or `production` with a `live_…` one.
      WIREBENCH_SERVER_PADDLE_ENVIRONMENT: ${PADDLE_ENVIRONMENT:?set PADDLE_ENVIRONMENT in .env}
      WIREBENCH_SERVER_PADDLE_CLIENT_TOKEN: ${PADDLE_CLIENT_TOKEN:?set PADDLE_CLIENT_TOKEN in .env}
      WIREBENCH_SERVER_PADDLE_TEAM_PRICE_ID: ${PADDLE_TEAM_PRICE_ID:?set PADDLE_TEAM_PRICE_ID in .env}
      # The notification destination's secret key, from a file: never in the environment or a log.
      WIREBENCH_SERVER_PADDLE_WEBHOOK_SECRET_FILE: /run/secrets/paddle_webhook_secret
      # Custom domains (spec §23.4): the listener Traefik polls, on the compose network only, and where the certificate
      # probe finds Traefik's TLS.
      WIREBENCH_SERVER_PROXY_LISTEN: 0.0.0.0:8081
      WIREBENCH_SERVER_PROXY_TOKEN_FILE: /run/secrets/proxy_token
      WIREBENCH_SERVER_PROXY_TLS_ADDRESS: traefik:443
    secrets:
      - proxy_token
      - paddle_webhook_secret
    volumes:
      - wirebench-data:/data

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: wirebench
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: wirebench
    volumes:
      - wirebench-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wirebench']
      interval: 5s
      timeout: 3s
      retries: 20

secrets:
  hetzner_api_token:
    file: ./secrets/hetzner_api_token
  # The same `PROXY_TOKEN` as Traefik's header, as a file for the server.
  proxy_token:
    environment: PROXY_TOKEN
  paddle_webhook_secret:
    file: ./secrets/paddle_webhook_secret

volumes:
  letsencrypt:
  wirebench-db:
  wirebench-data:
